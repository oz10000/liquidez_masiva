# liquidez_masiva/.github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt
          python -m pip install --no-cache-dir ruff mypy pytest pytest-cov

      - name: Lint (ruff)
        run: ruff check core scripts app tests

      - name: Type check (mypy) — sin || true
        run: mypy core scripts --ignore-missing-imports --no-error-summary

      - name: Tests + coverage
        run: pytest -q --cov=core --cov-report=term-missing