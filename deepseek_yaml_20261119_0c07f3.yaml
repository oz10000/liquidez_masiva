# liquidez_masiva/.github/workflows/daily_update.yml
name: Daily Data Update

on:
  schedule:
    - cron: "15 0 * * *"   # 00:15 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Update data
        run: python -m scripts.update_data

      - name: Commit changes
        run: |
          git config user.name  "liquidez-masiva-bot"
          git config user.email "bot@liquidez-masiva.local"
          if [[ -n "$(git status --porcelain data/)" ]]; then
            git add data/
            git commit -m "chore(data): daily update $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Sin cambios en data/"
          fi