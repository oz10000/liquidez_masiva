# liquidez_masiva/.github/workflows/weekly_backtest.yml
name: Weekly Backtest

on:
  schedule:
    - cron: "30 1 * * 1"   # lunes 01:30 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --no-cache-dir --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt

      - name: Run backtest
        run: python -m scripts.run_backtest --out reports

      - name: Commit reports
        run: |
          git config user.name  "liquidez-masiva-bot"
          git config user.email "bot@liquidez-masiva.local"
          if [[ -n "$(git status --porcelain reports/)" ]]; then
            git add reports/
            git commit -m "chore(report): weekly backtest $(date -u +%Y-%m-%d)"
            git push
          else
            echo "Sin cambios en reports/"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: reports/
          retention-days: 30
